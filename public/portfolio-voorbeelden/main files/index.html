<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fresheat Preview</title>
  <style>
    body{margin:0;background:#0f172a;color:#fff;font-family:Inter,Arial,sans-serif}
    .hero{padding:40px 20px;text-align:center;background:linear-gradient(180deg,#111827,#0b1220)}
    .hero h1{margin:0 0 8px;font-size:clamp(28px,5vw,48px)}
    .hero p{margin:0;color:#cbd5e1}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;padding:20px;max-width:1200px;margin:0 auto}
    .card{background:#111827;border:1px solid #334155;border-radius:12px;overflow:hidden}
    .card img{width:100%;height:180px;object-fit:cover;display:block}
    .card .cap{padding:10px;color:#cbd5e1;font-size:13px}
  </style>
</head>
<body>
  <section class="hero">
    <h1>Fresheat Template Preview</h1>
    <p>Assets locally mirrored from the live preview source.</p>
  </section>
  <section class="grid">
    <article class="card"><img src="/portfolio-voorbeelden/scraped-assets/html/fresheat/assets/img/header/home1.jpg" alt="home1"><div class="cap">Homepage Hero</div></article>
    <article class="card"><img src="/portfolio-voorbeelden/scraped-assets/html/fresheat/assets/img/dishes/dishes1_1.png" alt="dish1"><div class="cap">Dishes</div></article>
    <article class="card"><img src="/portfolio-voorbeelden/scraped-assets/html/fresheat/assets/img/about/aboutThumb1_1.png" alt="about"><div class="cap">About Section</div></article>
    <article class="card"><img src="/portfolio-voorbeelden/scraped-assets/html/fresheat/assets/img/blog/blogThumb1_1.jpg" alt="blog"><div class="cap">Blog Section</div></article>
    <article class="card"><img src="/portfolio-voorbeelden/scraped-assets/html/fresheat/assets/img/gallery/galleryThumb1_1.jpg" alt="gallery"><div class="cap">Gallery</div></article>
    <article class="card"><img src="/portfolio-voorbeelden/scraped-assets/html/fresheat/assets/img/chefe/chefeThumb2_1.jpg" alt="chef"><div class="cap">Chef Team</div></article>
  </section>
</body>
</html>
